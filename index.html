<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-page-title">커뮤니티 게시판</title>

  <!-- [1] Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- [2] Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 id="site-header-title" class="text-xl font-bold text-indigo-600 flex items-center gap-2">
        커뮤니티 게시판
      </h1>
      <div id="auth-status" class="flex items-center gap-3"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8 flex-1 w-full">

    <!-- 1. 로그인 / 회원가입 폼 -->
    <section id="auth-section" class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 max-w-md mx-auto hidden">
      <h2 id="auth-title" class="text-lg font-bold text-gray-800 text-center">로그인 / 회원가입</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">닉네임 (회원가입 시 필수)</label>
          <input type="text" id="nickname" placeholder="사용할 닉네임 입력" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="handleSignUp()" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg text-sm hover:bg-gray-200 transition">회원가입</button>
        <button type="button" onclick="handleSignIn()" class="flex-1 bg-indigo-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-indigo-700 transition">로그인</button>
      </div>
      <p id="auth-msg" class="text-xs text-center text-red-500 min-h-[16px]"></p>
    </section>

    <!-- 2. 동적 카테고리 탭 -->
    <section id="category-tabs-container" class="flex gap-2 overflow-x-auto pb-2 border-b">
    </section>

    <!-- 3. 게시글 작성 폼 -->
    <section id="write-section" class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 hidden">
      <h2 class="text-md font-bold text-gray-800 flex items-center gap-2">
        ✏️ 새 글 작성하기
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">카테고리</label>
          <select id="post-category" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
          <input type="text" id="post-title" placeholder="제목을 입력하세요" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">내용 (유튜브 주소를 남기시면 영상 플레이어가 자동 생성됩니다)</label>
        <textarea id="post-content" rows="3" placeholder="내용을 입력하세요..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <!-- 다중 파일 첨부 -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">
          📎 파일 첨부 (사진 자동 용량 축소, 음악, 동영상, PDF, 일반 문서 등 다중 선택 가능)
        </label>
        <input type="file" id="post-files" multiple accept="image/*, audio/*, video/*, application/pdf, .zip, .docx, .xlsx, .pptx, .hwp, .hwpx" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
      </div>

      <div class="flex justify-end">
        <button type="button" onclick="createPost()" id="submit-btn" class="bg-indigo-600 text-white font-semibold px-6 py-2 rounded-lg text-sm hover:bg-indigo-700 transition">
          게시하기
        </button>
      </div>
    </section>

    <!-- 4. 검색 기능 -->
    <section class="flex flex-col md:flex-row gap-2 bg-white p-4 rounded-xl shadow-sm border">
      <select id="search-category" class="px-3 py-2 border rounded-lg text-sm bg-white">
      </select>

      <select id="search-type" onchange="toggleSearchInput()" class="px-3 py-2 border rounded-lg text-sm bg-white">
        <option value="all">제목 + 내용</option>
        <option value="title">제목</option>
        <option value="content">내용</option>
        <option value="date">날짜 (달력)</option>
      </select>
      
      <input type="text" id="search-keyword" placeholder="검색어를 입력하세요" class="flex-1 px-3 py-2 border rounded-lg text-sm" onkeypress="if(event.key === 'Enter') executeSearch()">
      <input type="date" id="search-date" class="hidden flex-1 px-3 py-2 border rounded-lg text-sm" onkeypress="if(event.key === 'Enter') executeSearch()">
      
      <button type="button" onclick="executeSearch()" class="bg-gray-700 text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-gray-800 transition">검색</button>
      <button type="button" onclick="resetSearch()" class="bg-gray-200 text-gray-700 font-semibold px-5 py-2 rounded-lg text-sm hover:bg-gray-300 transition">초기화</button>
    </section>

    <!-- 5. 게시글 목록 출력 -->
    <section id="posts-container" class="space-y-4">
      <div class="text-center py-12 text-gray-400">게시글을 불러오는 중...</div>
    </section>

  </main>

  <footer class="w-full bg-white border-t mt-12 py-6 text-center text-xs text-gray-400">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <p id="footer-copy">© 커뮤니티</p>
      <a href="https://github.com/gitko11111/kim#readme" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-semibold text-gray-500 hover:text-indigo-600 underline transition">
        ⚙️ 관리자 가이드 (GitHub README)
      </a>
    </div>
  </footer>

  <script>
    const SITE_CONFIGS = {
      withkeke: {
        siteId: 'withkeke',
        title: "🐶 케케와 함께",
        categories: [
          { id: 'travel', label: '✈️ 여행' },
          { id: 'daily', label: '☕ 일상' },
          { id: 'food', label: '🍽️ 맛집' }
        ]
      },
      language: {
        siteId: 'language',
        title: "🌐 New Language Study",
        categories: [
          { id: 'korean', label: '🇰🇷 한국어' },
          { id: 'chinese1', label: '🇨🇳 중국어 1' },
          { id: 'chinese2', label: '🇨🇳 중국어 2' },
          { id: 'english1', label: '🇺🇸 영어 1' },
          { id: 'english2', label: '🇺🇸 영어 2' },
          { id: 'japanese', label: '🇯🇵 일본어 1' },
          { id: 'japanese2', label: '🇯🇵 일본어 2' },
          { id: 'spanish', label: '🇪🇸 스페인어' }
        ]
      }
    };

    // GitHub Pages 및 Netlify 공통 처리: 기본값을 'language'로 지정
    let CURRENT_SITE_KEY = 'language';
    if (window.location.hostname.includes('withkeke')) {
      CURRENT_SITE_KEY = 'withkeke';
    }
    const currentSiteConfig = SITE_CONFIGS[CURRENT_SITE_KEY];

    let rawUrl = "https://tspmpdtslcnozbbkhirs.supabase.co";
    let rawKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzcG1wZHRzbGNub3piYmtoaXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM2MTg1OTUsImV4cCI6MjA2OTE5NDU5NX0.8S-sWl53C8xL_JmG7K21K5L4I3X1C8";

    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(rawUrl, rawKey);
    } catch(e) {
      console.error("Supabase 생성 에러:", e);
    }

    let currentCategory = 'all';
    let currentUser = null;
    let userDisplayName = '';
    
    let currentSearchCategory = 'all';
    let currentSearchType = 'all';
    let currentSearchKeyword = '';
    let currentSearchDate = '';

    const loadedPostsMap = {};

    window.addEventListener('DOMContentLoaded', async () => {
      initSiteUI();
      try {
        await checkAuth();
      } catch (e) {
        console.error("인증 확인 중 에러 발생:", e);
      }
      loadPosts();
    });

    function initSiteUI() {
      document.getElementById('site-page-title').innerText = currentSiteConfig.title;
      document.getElementById('site-header-title').innerHTML = currentSiteConfig.title;
      document.getElementById('footer-copy').innerText = `© ${currentSiteConfig.title}`;

      const tabsContainer = document.getElementById('category-tabs-container');
      let tabsHtml = `<button type="button" onclick="setCategory('all')" id="tab-all" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow-sm shrink-0">전체</button>`;
      
      currentSiteConfig.categories.forEach(cat => {
        tabsHtml += `<button type="button" onclick="setCategory('${cat.id}')" id="tab-${cat.id}" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border shrink-0">${cat.label}</button>`;
      });
      tabsContainer.innerHTML = tabsHtml;

      const postCatSelect = document.getElementById('post-category');
      let postCatHtml = '';
      currentSiteConfig.categories.forEach(cat => {
        postCatHtml += `<option value="${cat.id}">${cat.label}</option>`;
      });
      postCatSelect.innerHTML = postCatHtml;

      const searchCatSelect = document.getElementById('search-category');
      let searchCatHtml = `<option value="all">전체 카테고리</option>`;
      currentSiteConfig.categories.forEach(cat => {
        searchCatHtml += `<option value="${cat.id}">${cat.label}</option>`;
      });
      searchCatSelect.innerHTML = searchCatHtml;
    }

    async function checkAuth() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.auth.getUser();
        currentUser = data?.user || null;
        if (currentUser) {
          userDisplayName = currentUser.user_metadata?.nickname || currentUser.email.split('@')[0];
        }
      } catch (err) {
        currentUser = null;
        userDisplayName = '';
      }

      const authStatusEl = document.getElementById('auth-status');
      const authSectionEl = document.getElementById('auth-section');
      const writeSectionEl = document.getElementById('write-section');

      if (currentUser) {
        authStatusEl.innerHTML = `
          <span class="text-xs text-gray-600 font-medium">👤 ${escapeHtml(userDisplayName)} 님</span>
          <button type="button" onclick="handleSignOut()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        `;
        authSectionEl.classList.add('hidden');
        writeSectionEl.classList.remove('hidden');
      } else {
        authStatusEl.innerHTML = `
          <button type="button" onclick="toggleAuthForm()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">로그인 / 회원가입</button>
        `;
        writeSectionEl.classList.add('hidden');
      }
    }

    function toggleAuthForm() {
      document.getElementById('auth-section').classList.toggle('hidden');
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value.trim();
      const msgEl = document.getElementById('auth-msg');

      if(!email || !password || !nickname) {
        msgEl.innerText = "이메일, 비밀번호, 닉네임을 모두 입력해주세요.";
        return;
      }

      msgEl.innerText = "회원가입 처리 중...";
      const { error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { nickname: nickname } }
      });

      if (error) {
        msgEl.innerText = "회원가입 실패: " + error.message;
      } else {
        msgEl.innerText = "가입 완료! 로그인되었습니다.";
        await checkAuth();
        loadPosts();
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('auth-msg');

      if(!email || !password) {
        msgEl.innerText = "이메일과 비밀번호를 입력해주세요.";
        return;
      }

      msgEl.innerText = "로그인 중...";
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msgEl.innerText = "로그인 실패: " + error.message;
      } else {
        msgEl.innerText = "";
        await checkAuth();
        loadPosts();
      }
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      await checkAuth();
      loadPosts();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border shrink-0";
      });
      const activeBtn = document.getElementById(`tab-${cat}`);
      if(activeBtn) {
        activeBtn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow-sm shrink-0";
      }

      document.getElementById('search-category').value = cat;
      currentSearchCategory = cat;

      loadPosts();
    }

    function toggleSearchInput() {
      const type = document.getElementById('search-type').value;
      const keywordInput = document.getElementById('search-keyword');
      const dateInput = document.getElementById('search-date');

      if (type === 'date') {
        keywordInput.classList.add('hidden');
        dateInput.classList.remove('hidden');
      } else {
        keywordInput.classList.remove('hidden');
        dateInput.classList.add('hidden');
      }
    }

    function executeSearch() {
      currentSearchCategory = document.getElementById('search-category').value;
      currentSearchType = document.getElementById('search-type').value;

      if (currentSearchType === 'date') {
        currentSearchDate = document.getElementById('search-date').value;
        currentSearchKeyword = '';
      } else {
        currentSearchKeyword = document.getElementById('search-keyword').value.trim();
        currentSearchDate = '';
      }

      currentCategory = currentSearchCategory;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border shrink-0";
      });
      const activeBtn = document.getElementById(`tab-${currentCategory}`);
      if(activeBtn) {
        activeBtn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow-sm shrink-0";
      }

      loadPosts();
    }

    function resetSearch() {
      document.getElementById('search-category').value = 'all';
      document.getElementById('search-type').value = 'all';
      document.getElementById('search-keyword').value = '';
      document.getElementById('search-date').value = '';
      
      currentSearchCategory = 'all';
      currentSearchType = 'all';
      currentSearchKeyword = '';
      currentSearchDate = '';

      toggleSearchInput();
      setCategory('all');
    }

    function getYouTubeEmbedsHtml(content) {
      if (!content) return '';
      const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
      const videoIds = new Set();
      let match;
      while ((match = ytRegex.exec(content)) !== null) {
        videoIds.add(match[1]);
      }

      if (videoIds.size === 0) return '';

      let html = '<div class="space-y-3 pt-2">';
      videoIds.forEach(id => {
        html += `
          <div class="space-y-1">
            <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-sm border bg-black">
              <iframe 
                class="absolute top-0 left-0 w-full h-full"
                src="https://www.youtube.com/embed/${id}" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
              </iframe>
            </div>
            <div class="flex justify-between items-center text-[11px] px-1">
              <span class="text-gray-400">💡 유튜브 영상 자동 감지됨</span>
              <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 font-semibold hover:underline">
                ↗️ YouTube에서 크게 보기
              </a>
            </div>
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    function parseAttachments(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'object') return [raw];
      if (typeof raw === 'string') {
        const trimmed = raw.trim();
        if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
          try {
            const parsed = JSON.parse(trimmed);
            return Array.isArray(parsed) ? parsed : [parsed];
          } catch(e) {
            return [{ name: '첨부파일', url: trimmed, type: 'image/jpeg' }];
          }
        } else if (trimmed) {
          return [{ name: '첨부파일', url: trimmed, type: 'image/jpeg' }];
        }
      }
      return [];
    }

    function getAttachmentsHtml(rawData) {
      const attachments = parseAttachments(rawData);
      if (attachments.length === 0) return '';

      let html = '<div class="pt-2 space-y-3">';
      attachments.forEach((att) => {
        const type = att.type || '';
        const name = escapeHtml(att.name || '첨부파일');
        const url = att.url;

        if (type.startsWith('image/')) {
          html += `
            <div class="space-y-1.5">
              <a href="${url}" target="_blank" rel="noopener noreferrer" class="block relative overflow-hidden rounded-xl border bg-slate-900/5 flex justify-center items-center cursor-pointer">
                <img src="${url}" alt="${name}" class="max-h-[500px] w-auto object-contain hover:scale-[1.01] transition duration-200">
              </a>
              <div class="flex justify-between items-center text-[11px] text-gray-500 px-1">
                <a href="${url}" target="_blank" rel="noopener noreferrer" class="truncate hover:underline text-indigo-600 font-semibold">🖼️ ${name} (🔍 원본)</a>
                <a href="${url}" download="${name}" target="_blank" class="inline-flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-2 py-1 rounded transition shrink-0">
                  📥 다운로드
                </a>
              </div>
            </div>`;
        } 
        else if (type.startsWith('audio/')) {
          html += `
            <div class="bg-purple-50 p-2.5 rounded-xl border border-purple-100 space-y-1">
              <div class="flex justify-between items-center text-[11px] font-semibold text-purple-700">
                <span class="truncate">🎵 ${name}</span>
                <a href="${url}" download="${name}" target="_blank" class="text-purple-600 hover:underline shrink-0">📥 다운로드</a>
              </div>
              <audio controls class="w-full h-8">
                <source src="${url}" type="${type}">
              </audio>
            </div>`;
        } 
        else if (type.startsWith('video/')) {
          html += `
            <div class="bg-black/5 p-2.5 rounded-xl border space-y-1">
              <div class="flex justify-between items-center text-[11px] font-semibold text-gray-700">
                <span class="truncate">🎬 ${name}</span>
                <a href="${url}" download="${name}" target="_blank" class="text-indigo-600 hover:underline shrink-0">📥 다운로드</a>
              </div>
              <video controls class="w-full max-h-[450px] rounded-lg">
                <source src="${url}" type="${type}">
              </video>
            </div>`;
        } 
        else if (type === 'application/pdf') {
          html += `
            <div class="flex justify-between items-center p-2.5 bg-red-50 rounded-xl border border-red-100 text-[11px]">
              <div class="flex items-center gap-1.5 truncate pr-2">
                <span>📄</span>
                <span class="font-medium text-red-700 truncate">${name}</span>
              </div>
              <div class="flex gap-1.5 shrink-0">
                <a href="${url}" target="_blank" rel="noopener noreferrer" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-2.5 py-1 rounded transition">
                  📄 PDF 보기
                </a>
                <a href="${url}" download="${name}" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-2 py-1 rounded transition">
                  📥 다운로드
                </a>
              </div>
            </div>`;
        } 
        else {
          html += `
            <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl border text-[11px]">
              <div class="flex items-center gap-1.5 truncate pr-2">
                <span>💾</span>
                <span class="font-medium text-gray-700 truncate">${name}</span>
              </div>
              <a href="${url}" download="${name}" target="_blank" class="shrink-0 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded transition">
                📥 다운로드
              </a>
            </div>`;
        }
      });
      html += '</div>';
      return html;
    }

    async function compressImage(file) {
      return new Promise((resolve) => {
        if (!file.type.startsWith('image/') || file.type.includes('svg') || file.size <= 500 * 1024) {
          resolve(file);
          return;
        }

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1200;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (!blob) {
                resolve(file);
                return;
              }
              const compressedFile = new File([blob], file.name, {
                type: 'image/jpeg',
                lastModified: Date.now()
              });
              resolve(compressedFile);
            }, 'image/jpeg', 0.80);
          };
          img.onerror = () => resolve(file);
        };
        reader.onerror = () => resolve(file);
      });
    }

    async function uploadFilesToStorage(files, bucketName = 'files', prefix = 'file') {
      const attachments = [];

      for (let i = 0; i < files.length; i++) {
        let file = files[i];

        if (file.type.startsWith('image/')) {
          file = await compressImage(file);
        }

        const fileExt = file.name.split('.').pop();
        const fileName = `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2,7)}.${fileExt}`;

        const { error: uploadError } = await supabaseClient.storage.from(bucketName).upload(fileName, file);
        if (uploadError) {
          throw new Error(`'${file.name}' 업로드 실패: ` + uploadError.message);
        }

        const { data: publicUrlData } = supabaseClient.storage.from(bucketName).getPublicUrl(fileName);
        attachments.push({
          name: file.name,
          url: publicUrlData.publicUrl,
          type: file.type
        });
      }

      return attachments;
    }

    async function createPost() {
      const category = document.getElementById('post-category').value;
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const fileInput = document.getElementById('post-files');
      const submitBtn = document.getElementById('submit-btn');

      if(!title || !content) {
        alert("제목과 내용을 입력해주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "업로드 중...";

      const files = Array.from(fileInput.files);

      try {
        let attachments = [];
        if (files.length > 0) {
          attachments = await uploadFilesToStorage(files, 'files', 'post');
        }

        const imageUrlValue = attachments.length > 0 ? JSON.stringify(attachments) : null;

        const { error: dbError } = await supabaseClient
          .from('posts')
          .insert([{ category, title, content, image_url: imageUrlValue }]);

        if (dbError) {
          alert("글 저장 실패: " + dbError.message);
        } else {
          document.getElementById('post-title').value = '';
          document.getElementById('post-content').value = '';
          fileInput.value = '';
          loadPosts();
        }
      } catch (e) {
        alert("게시물 등록 중 오류 발생: " + e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "게시하기";
      }
    }

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      if (!container) return;
      container.innerHTML = `<div class="text-center py-12 text-gray-400">게시글을 불러오는 중...</div>`;

      try {
        let query = supabaseClient.from('posts').select('*').order('created_at', { ascending: false });

        if (currentCategory !== 'all') {
          query = query.eq('category', currentCategory);
        } else {
          const validCatIds = currentSiteConfig.categories.map(c => c.id);
          query = query.in('category', validCatIds);
        }

        if (currentSearchType !== 'date' && currentSearchKeyword) {
          if (currentSearchType === 'all') {
            query = query.or(`title.ilike.%${currentSearchKeyword}%,content.ilike.%${currentSearchKeyword}%`);
          } else if (currentSearchType === 'title') {
            query = query.ilike('title', `%${currentSearchKeyword}%`);
          } else if (currentSearchType === 'content') {
            query = query.ilike('content', `%${currentSearchKeyword}%`);
          }
        }

        if (currentSearchType === 'date' && currentSearchDate) {
          const startDate = new Date(currentSearchDate);
          startDate.setHours(0, 0, 0, 0);
          const endDate = new Date(currentSearchDate);
          endDate.setHours(23, 59, 59, 999);

          query = query.gte('created_at', startDate.toISOString())
                       .lte('created_at', endDate.toISOString());
        }

        const { data: posts, error } = await query;

        if (error) {
          container.innerHTML = `<div class="bg-white p-8 rounded-2xl border text-center text-red-500">⚠️ 불러오기 실패: ${escapeHtml(error.message)}</div>`;
          return;
        }

        const categoryLabels = {};
        currentSiteConfig.categories.forEach(c => { categoryLabels[c.id] = c.label; });

        if (!posts || posts.length === 0) {
          container.innerHTML = `<div class="bg-white p-12 rounded-2xl border text-center text-gray-400">등록된 게시글이 없습니다.</div>`;
          return;
        }

        posts.forEach(p => { loadedPostsMap[p.id] = p; });

        const postHtmlPromises = posts.map(async (post) => {
          const dateStr = new Date(post.created_at).toLocaleString('ko-KR', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          let comments = [];
          try {
            const { data: commentData } = await supabaseClient
              .from('comments')
              .select('*')
              .eq('post_id', post.id)
              .order('created_at', { ascending: true });
            if (commentData) comments = commentData;
          } catch (e) {}

          const commentsListHtml = comments && comments.length > 0 
            ? comments.map(c => {
                let authorDisplay = c.user_email || '익명';
                if (authorDisplay.includes('@')) authorDisplay = authorDisplay.split('@')[0];
                const commentYtEmbed = getYouTubeEmbedsHtml(c.content);
                const commentAttachments = getAttachmentsHtml(c.image_url);

                return `
                  <div class="bg-slate-50 p-3 rounded-xl text-xs space-y-2 border">
                    <div class="flex justify-between font-semibold text-gray-700">
                      <span>👤 ${escapeHtml(authorDisplay)}</span>
                      <span class="text-gray-400 font-normal text-[11px]">${new Date(c.created_at).toLocaleString('ko-KR')}</span>
                    </div>
                    ${c.content ? `<p class="text-gray-600 whitespace-pre-wrap leading-relaxed">${escapeHtml(c.content)}</p>` : ''}
                    ${commentYtEmbed}
                    ${commentAttachments}
                  </div>
                `;
              }).join('')
            : '<p class="text-xs text-gray-400 text-center py-2">등록된 댓글이 없습니다.</p>';

          const postYtEmbed = getYouTubeEmbedsHtml(post.content);
          const postAttachments = getAttachmentsHtml(post.image_url);

          return `
            <article class="bg-white p-6 rounded-2xl shadow-sm border space-y-4" id="post-article-${post.id}">
              <div class="flex justify-between items-start">
                <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full">
                  ${categoryLabels[post.category] || post.category}
                </span>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-400">${dateStr}</span>
                  ${currentUser ? `
                    <button type="button" onclick="openEditForm(${post.id})" class="text-xs text-blue-500 hover:text-blue-700 font-semibold px-2 py-1 rounded border border-blue-200">✏️ 수정</button>
                    <button type="button" onclick="deletePost(${post.id})" class="text-xs text-red-500 hover:text-red-700 font-semibold px-2 py-1 rounded border border-red-200">🗑️ 삭제</button>
                  ` : ''}
                </div>
              </div>

              <div id="post-view-${post.id}" class="space-y-4">
                <h3 class="text-lg font-bold text-gray-800">${escapeHtml(post.title)}</h3>
                <p class="text-sm text-gray-600 whitespace-pre-wrap leading-relaxed">${escapeHtml(post.content)}</p>
                ${postYtEmbed}
                ${postAttachments}
              </div>

              <!-- 댓글 영역 -->
              <div class="pt-4 border-t space-y-3">
                <h5 class="text-xs font-bold text-gray-700">💬 댓글</h5>
                <div class="space-y-2">${commentsListHtml}</div>
                ${currentUser ? `
                  <div class="pt-3 border-t space-y-2">
                    <textarea id="comment-input-${post.id}" rows="2" placeholder="댓글 내용 (유튜브 주소 입력 시 영상 자동 전환)" class="w-full px-3 py-2 border rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    <div class="space-y-1">
                      <label class="block text-[11px] font-semibold text-gray-500">📎 댓글 파일 첨부 (사진, 음악, 동영상, PDF 다중 선택 가능)</label>
                      <div class="flex items-center justify-between gap-2">
                        <input type="file" id="comment-files-${post.id}" multiple accept="image/*, audio/*, video/*, application/pdf, .zip, .docx, .xlsx, .pptx, .hwp, .hwpx" class="text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 flex-1">
                        <button type="button" onclick="addComment(${post.id})" id="comment-submit-btn-${post.id}" class="bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-lg hover:bg-indigo-700 transition shrink-0">댓글 등록</button>
                      </div>
                    </div>
                  </div>
                ` : `
                  <p class="text-xs text-gray-400 text-center py-2 bg-gray-50 rounded-lg">댓글을 작성하려면 로그인이 필요합니다.</p>
                `}
              </div>
            </article>
          `;
        });

        const postsHtmlArray = await Promise.all(postHtmlPromises);
        container.innerHTML = postsHtmlArray.join('');
      } catch (err) {
        container.innerHTML = `<div class="bg-white p-8 rounded-2xl border text-center text-red-500">⚠️ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function addComment(postId) {
      if (!currentUser) {
        alert("로그인이 필요합니다.");
        return;
      }

      const inputEl = document.getElementById(`comment-input-${postId}`);
      const fileInput = document.getElementById(`comment-files-${postId}`);
      const submitBtn = document.getElementById(`comment-submit-btn-${postId}`);
      const content = inputEl ? inputEl.value.trim() : '';

      const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];

      if (!content && files.length === 0) {
        alert("댓글 내용이나 첨부파일 중 하나는 입력해주세요.");
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "등록 중...";
      }

      try {
        let attachments = [];
        if (files.length > 0) {
          attachments = await uploadFilesToStorage(files, 'files', 'comment');
        }

        const authorName = userDisplayName || currentUser.email.split('@')[0];
        const imageUrlValue = attachments.length > 0 ? JSON.stringify(attachments) : null;

        const payload = { 
          post_id: postId, 
          user_email: authorName, 
          content: content 
        };

        if (imageUrlValue) {
          payload.image_url = imageUrlValue;
        }

        const { data, error } = await supabaseClient
          .from('comments')
          .insert([payload])
          .select();

        if (error) {
          alert("댓글 작성 실패: " + error.message);
        } else if (!data || data.length === 0) {
          alert("댓글 작성 실패: DB 권한(RLS) 문제이거나 컬럼이 없습니다.");
        } else {
          if (inputEl) inputEl.value = '';
          if (fileInput) fileInput.value = '';
          loadPosts();
        }
      } catch (e) {
        alert("댓글 등록 중 오류 발생: " + e.message);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = "댓글 등록";
        }
      }
    }

    async function deletePost(postId) {
      if (!currentUser || !confirm("정말로 이 게시글을 삭제하시겠습니까?")) return;

      try {
        const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
        if (error) alert("삭제 실패: " + error.message);
        else loadPosts();
      } catch (err) {
        alert("삭제 중 오류 발생");
      }
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function openEditForm(postId) {
      const post = loadedPostsMap[postId];
      if (!post) {
        alert("게시글 정보를 찾을 수 없습니다.");
        return;
      }

      const viewEl = document.getElementById(`post-view-${postId}`);
      if (!viewEl) return;

      let catOptionsHtml = '';
      currentSiteConfig.categories.forEach(cat => {
        const selected = (cat.id === post.category) ? 'selected' : '';
        catOptionsHtml += `<option value="${cat.id}" ${selected}>${cat.label}</option>`;
      });

      viewEl.innerHTML = `
        <div class="bg-indigo-50/70 p-4 rounded-xl border border-indigo-200 space-y-3">
          <h4 class="text-sm font-bold text-indigo-700 flex items-center gap-1">✏️ 게시글 수정</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">카테고리</label>
              <select id="edit-category-${postId}" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${catOptionsHtml}
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
              <input type="text" id="edit-title-${postId}" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">내용</label>
            <textarea id="edit-content-${postId}" rows="4" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">추가 파일 첨부 (기존 파일에 유지 추가)</label>
            <input type="file" id="edit-files-${postId}" multiple accept="image/*, audio/*, video/*, application/pdf, .zip, .docx, .xlsx, .pptx, .hwp, .hwpx" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-100 file:text-indigo-700">
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="cancelEdit()" class="bg-gray-200 text-gray-700 font-semibold px-4 py-1.5 rounded-lg text-xs hover:bg-gray-300 transition">취소</button>
            <button type="button" onclick="updatePost(${postId})" id="edit-submit-btn-${postId}" class="bg-indigo-600 text-white font-semibold px-4 py-1.5 rounded-lg text-xs hover:bg-indigo-700 transition">저장</button>
          </div>
        </div>
      `;

      document.getElementById(`edit-title-${postId}`).value = post.title || '';
      document.getElementById(`edit-content-${postId}`).value = post.content || '';
    }

    function cancelEdit() {
      loadPosts(); 
    }

    async function updatePost(postId) {
      const post = loadedPostsMap[postId];
      const category = document.getElementById(`edit-category-${postId}`).value;
      const title = document.getElementById(`edit-title-${postId}`).value.trim();
      const content = document.getElementById(`edit-content-${postId}`).value.trim();
      const fileInput = document.getElementById(`edit-files-${postId}`);
      const submitBtn = document.getElementById(`edit-submit-btn-${postId}`);

      if (!title || !content) {
        alert("제목과 내용을 모두 입력해주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "저장 중...";

      try {
        let existingAttachments = parseAttachments(post.image_url);
        const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];

        if (files.length > 0) {
          const newAttachments = await uploadFilesToStorage(files, 'files', 'post');
          existingAttachments = [...existingAttachments, ...newAttachments];
        }

        const imageUrlValue = existingAttachments.length > 0 ? JSON.stringify(existingAttachments) : null;

        const { data, error } = await supabaseClient
          .from('posts')
          .update({ category: category, title: title, content: content, image_url: imageUrlValue })
          .eq('id', postId)
          .select();

        if (error) {
          alert("수정 실패: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "저장";
        } else if (!data || data.length === 0) {
          alert("수정 실패: DB 권한(RLS) 문제이거나 해당 게시글이 없습니다.");
          submitBtn.disabled = false;
          submitBtn.innerText = "저장";
        } else {
          alert("성공적으로 수정되었습니다!");
          loadPosts(); 
        }
      } catch (e) {
        alert("수정 중 오류 발생: " + e.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "저장";
      }
    }
  </script>
