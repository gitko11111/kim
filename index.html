<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>독서회 커뮤니티 게시판</title>

  <!-- [1] Tailwind CSS CDN: 모던 UI 디자인을 위한 유틸리티 CSS 라이브러리 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- [2] Supabase JS SDK v2: 백엔드(DB, Auth, Storage) 연동 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- ==================================================================== -->
  <!-- [HEADER] 상단 네비게이션 바 & 사용자 상태 표시                       -->
  <!-- ==================================================================== -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
        📖 독서회 커뮤니티
      </h1>
      <!-- 로그인 여부에 따라 '로그인 버튼' 또는 '사용자 이름/로그아웃 버튼'이 동적으로 주입됩니다 -->
      <div id="auth-status" class="flex items-center gap-3"></div>
    </div>
  </header>

  <!-- ==================================================================== -->
  <!-- [MAIN] 메인 영역 (로그인폼, 카테고리, 작성폼, 검색, 게시글목록)     -->
  <!-- ==================================================================== -->
  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8 flex-1 w-full">

    <!-- 1. 로그인 / 회원가입 폼 (기본적으로 숨김 처리: hidden) -->
    <section id="auth-section" class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 max-w-md mx-auto hidden">
      <h2 id="auth-title" class="text-lg font-bold text-gray-800 text-center">로그인 / 회원가입</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">닉네임 (회원가입 시 필수)</label>
          <input type="text" id="nickname" placeholder="사용할 닉네임 입력" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="handleSignUp()" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg text-sm hover:bg-gray-200 transition">회원가입</button>
        <button onclick="handleSignIn()" class="flex-1 bg-indigo-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-indigo-700 transition">로그인</button>
      </div>
      <p id="auth-msg" class="text-xs text-center text-red-500 min-h-[16px]"></p>
    </section>

    <!-- 2. 카테고리 필터 탭 (전체/독서/진행/단어/후기) -->
    <section class="flex gap-2 overflow-x-auto pb-2 border-b">
      <button onclick="setCategory('all')" id="tab-all" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow-sm">전체보기</button>
      <button onclick="setCategory('reading_pages')" id="tab-reading_pages" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border">📖 독서 페이지</button>
      <button onclick="setCategory('notice')" id="tab-notice" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border">📢 진행 여부</button>
      <button onclick="setCategory('vocabulary')" id="tab-vocabulary" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border">📝 오늘의 단어</button>
      <button onclick="setCategory('review')" id="tab-review" class="cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border">🎨 모임 후기/그림</button>
    </section>

    <!-- 3. 게시글 작성 폼 (로그인한 사용자에게만 표시됨) -->
    <section id="write-section" class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 hidden">
      <h2 class="text-md font-bold text-gray-800 flex items-center gap-2">
        ✏️ 새 글 작성하기
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">카테고리</label>
          <select id="post-category" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="reading_pages">📖 독서 페이지</option>
            <option value="notice">📢 진행 여부</option>
            <option value="vocabulary">📝 오늘의 단어</option>
            <option value="review">🎨 모임 후기/그림</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
          <input type="text" id="post-title" placeholder="제목을 입력하세요" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">내용 (유튜브 주소를 남기시면 영상 플레이어가 자동 생성됩니다)</label>
        <textarea id="post-content" rows="3" placeholder="내용을 입력하세요..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <!-- 다중 파일 첨부 영역 (사진, 음악, 동영상, PDF, 일반 문서 지원) -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">
          📎 파일 첨부 (사진 자동 용량 축소, 음악, 동영상, PDF 등 다중 선택 가능)
        </label>
        <input type="file" id="post-files" multiple accept="image/*, audio/*, video/*, application/pdf, .zip, .docx, .xlsx, .pptx, .hwp" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
      </div>

      <div class="flex justify-end">
        <button onclick="createPost()" id="submit-btn" class="bg-indigo-600 text-white font-semibold px-6 py-2 rounded-lg text-sm hover:bg-indigo-700 transition">
          게시하기
        </button>
      </div>
    </section>

    <!-- 4. 검색 기능 (키워드 / 날짜 검색) -->
    <section class="flex flex-col md:flex-row gap-2 bg-white p-4 rounded-xl shadow-sm border">
      <select id="search-category" class="px-3 py-2 border rounded-lg text-sm bg-white">
        <option value="all">전체 카테고리</option>
        <option value="reading_pages">📖 독서 페이지</option>
        <option value="notice">📢 진행 여부</option>
        <option value="vocabulary">📝 오늘의 단어</option>
        <option value="review">🎨 모임 후기/그림</option>
      </select>

      <select id="search-type" onchange="toggleSearchInput()" class="px-3 py-2 border rounded-lg text-sm bg-white">
        <option value="all">제목 + 내용</option>
        <option value="title">제목</option>
        <option value="content">내용</option>
        <option value="date">날짜 (달력)</option>
      </select>
      
      <input type="text" id="search-keyword" placeholder="검색어를 입력하세요" class="flex-1 px-3 py-2 border rounded-lg text-sm" onkeypress="if(event.key === 'Enter') executeSearch()">
      <input type="date" id="search-date" class="hidden flex-1 px-3 py-2 border rounded-lg text-sm" onkeypress="if(event.key === 'Enter') executeSearch()">
      
      <button onclick="executeSearch()" class="bg-gray-700 text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-gray-800 transition">검색</button>
      <button onclick="resetSearch()" class="bg-gray-200 text-gray-700 font-semibold px-5 py-2 rounded-lg text-sm hover:bg-gray-300 transition">초기화</button>
    </section>

    <!-- 5. 게시글 목록 출력 컨테이너 -->
    <section id="posts-container" class="space-y-4">
      <div class="text-center py-12 text-gray-400">게시글을 불러오는 중...</div>
    </section>

  </main>

  <!-- ==================================================================== -->
  <!-- [FOOTER] 푸터 및 관리자 가이드 링크                                 -->
  <!-- ==================================================================== -->
  <footer class="w-full bg-white border-t mt-12 py-6 text-center text-xs text-gray-400">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <p>© 독서회 커뮤니티</p>
      <a href="https://github.com/gitko11111/kim#readme" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-semibold text-gray-500 hover:text-indigo-600 underline transition">
        ⚙️ 관리자 가이드 (GitHub README)
      </a>
    </div>
  </footer>

  <!-- ==================================================================== -->
  <!-- [JAVASCRIPT] 핵심 동작 로직                                           -->
  <!-- ==================================================================== -->
  <script>
    /* --------------------------------------------------------------------
     * [Netlify 환경변수 치환 영역]
     * Netlify 배포 시 빌드 파이프라인(sed명령어)에 의해 아래 문구가 
     * 각 사이트의 실제 Supabase 접속 정보로 자동 설정됩니다.
     * -------------------------------------------------------------------- */
    const SUPABASE_URL = "__SUPABASE_URL__";
    const SUPABASE_KEY = "__SUPABASE_ANON_KEY__";

    // Supabase 클라이언트 생성
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* --------------------------------------------------------------------
     * [전역 상태 변수]
     * -------------------------------------------------------------------- */
    let currentCategory = 'all';        // 현재 선택된 카테고리 탭
    let currentUser = null;            // 현재 로그인된 사용자 정보
    let userDisplayName = '';          // 표시용 닉네임 또는 이메일 아이디
    
    let currentSearchCategory = 'all'; // 검색 카테고리
    let currentSearchType = 'all';     // 검색 조건 (all/title/content/date)
    let currentSearchKeyword = '';    // 검색 키워드
    let currentSearchDate = '';       // 검색 날짜

    // [중요] 게시글 수정 시 따옴표 탈출 버그 방지를 위해 조회된 글 데이터를 ID별로 저장하는 맵
    const loadedPostsMap = {};

    /* --------------------------------------------------------------------
     * [초기화] 페이지 로드 시 사용자 인증 상태 확인 및 게시글 불러오기
     * -------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await checkAuth();
      } catch (e) {
        console.error("인증 확인 중 에러 발생:", e);
      }
      loadPosts();
    });

    /* --------------------------------------------------------------------
     * [인증 관련 기능] checkAuth, handleSignUp, handleSignIn, handleSignOut
     * -------------------------------------------------------------------- */
    async function checkAuth() {
      try {
        const { data } = await supabaseClient.auth.getUser();
        currentUser = data?.user || null;
        if (currentUser) {
          userDisplayName = currentUser.user_metadata?.nickname || currentUser.email.split('@')[0];
        }
      } catch (err) {
        currentUser = null;
        userDisplayName = '';
      }

      const authStatusEl = document.getElementById('auth-status');
      const authSectionEl = document.getElementById('auth-section');
      const writeSectionEl = document.getElementById('write-section');

      if (currentUser) {
        // 로그인 상태일 때 상단 바 및 작성 폼 활성화
        authStatusEl.innerHTML = `
          <span class="text-xs text-gray-600 font-medium">👤 ${escapeHtml(userDisplayName)} 님</span>
          <button onclick="handleSignOut()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        `;
        authSectionEl.classList.add('hidden');
        writeSectionEl.classList.remove('hidden');
      } else {
        // 비로그인 상태일 때
        authStatusEl.innerHTML = `
          <button onclick="toggleAuthForm()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">로그인 / 회원가입</button>
        `;
        writeSectionEl.classList.add('hidden');
      }
    }

    function toggleAuthForm() {
      document.getElementById('auth-section').classList.toggle('hidden');
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value.trim();
      const msgEl = document.getElementById('auth-msg');

      if(!email || !password || !nickname) {
        msgEl.innerText = "이메일, 비밀번호, 닉네임을 모두 입력해주세요.";
        return;
      }

      msgEl.innerText = "회원가입 처리 중...";
      const { error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { nickname: nickname } }
      });

      if (error) {
        msgEl.innerText = "회원가입 실패: " + error.message;
      } else {
        msgEl.innerText = "가입 완료! 로그인되었습니다.";
        await checkAuth();
        loadPosts();
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('auth-msg');

      if(!email || !password) {
        msgEl.innerText = "이메일과 비밀번호를 입력해주세요.";
        return;
      }

      msgEl.innerText = "로그인 중...";
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msgEl.innerText = "로그인 실패: " + error.message;
      } else {
        msgEl.innerText = "";
        await checkAuth();
        loadPosts();
      }
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      await checkAuth();
      loadPosts();
    }

    /* --------------------------------------------------------------------
     * [카테고리 및 검색 제어 함수]
     * -------------------------------------------------------------------- */
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border";
      });
      const activeBtn = document.getElementById(`tab-${cat}`);
      if(activeBtn) {
        activeBtn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow-sm";
      }

      document.getElementById('search-category').value = cat;
      currentSearchCategory = cat;

      loadPosts();
    }

    function toggleSearchInput() {
      const type = document.getElementById('search-type').value;
      const keywordInput = document.getElementById('search-keyword');
      const dateInput = document.getElementById('search-date');

      if (type === 'date') {
        keywordInput.classList.add('hidden');
        dateInput.classList.remove('hidden');
      } else {
        keywordInput.classList.remove('hidden');
        dateInput.classList.add('hidden');
      }
    }

    function executeSearch() {
      currentSearchCategory = document.getElementById('search-category').value;
      currentSearchType = document.getElementById('search-type').value;

      if (currentSearchType === 'date') {
        currentSearchDate = document.getElementById('search-date').value;
        currentSearchKeyword = '';
      } else {
        currentSearchKeyword = document.getElementById('search-keyword').value.trim();
        currentSearchDate = '';
      }

      currentCategory = currentSearchCategory;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border";
      });
      const activeBtn = document.getElementById(`tab-${currentCategory}`);
      if(activeBtn) {
        activeBtn.className = "cat-tab px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow-sm";
      }

      loadPosts();
    }

    function resetSearch() {
      document.getElementById('search-category').value = 'all';
      document.getElementById('search-type').value = 'all';
      document.getElementById('search-keyword').value = '';
      document.getElementById('search-date').value = '';
      
      currentSearchCategory = 'all';
      currentSearchType = 'all';
      currentSearchKeyword = '';
      currentSearchDate = '';

      toggleSearchInput();
      setCategory('all');
    }

    /* --------------------------------------------------------------------
     * [유튜브 주소 감지 및 Embed 플레이어 생성 함수]
     * 본문이나 댓글 내의 YouTube 링크(Shorts, watch, youtu.be)를 임베드 파스
     * -------------------------------------------------------------------- */
    function getYouTubeEmbedsHtml(content) {
      if (!content) return '';
      const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
      const videoIds = new Set();
      let match;
      while ((match = ytRegex.exec(content)) !== null) {
        videoIds.add(match[1]);
      }

      if (videoIds.size === 0) return '';

      let html = '<div class="space-y-3 pt-2">';
      videoIds.forEach(id => {
        html += `
          <div class="space-y-1">
            <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-sm border bg-black">
              <iframe 
                class="absolute top-0 left-0 w-full h-full"
                src="https://www.youtube.com/embed/${id}" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
              </iframe>
            </div>
            <div class="flex justify-between items-center text-[11px] px-1">
              <span class="text-gray-400">💡 로컬 파일 실행 시 유튜브 차단이 생길 수 있습니다</span>
              <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 font-semibold hover:underline">
                ↗️ YouTube에서 직접 보기
              </a>
            </div>
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    /* --------------------------------------------------------------------
     * [첨부파일 파서 및 HTML 생성 함수]
     * DB의 image_url/attachments 컬럼(JSON, JSONB, 단일 URL)의 구조를 정규화
     * 사진, 음악, 동영상, PDF, 일반 문서 형식에 맞춰 렌더링
