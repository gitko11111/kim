<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="site-page-title">커뮤니티 게시판</title>

  <!-- [1] Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- [2] Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex justify-between items-center">
      <h1 id="site-header-title" class="text-lg sm:text-xl font-bold text-indigo-600 flex items-center gap-2">
        커뮤니티 게시판
      </h1>
      <div id="auth-status" class="flex items-center gap-2 sm:gap-3"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-8 space-y-4 sm:space-y-8 flex-1 w-full">

    <!-- 1. 로그인 / 회원가입 폼 -->
    <section id="auth-section" class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border space-y-4 max-w-md mx-auto hidden">
      <h2 id="auth-title" class="text-base sm:text-lg font-bold text-gray-800 text-center">로그인 / 회원가입</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">닉네임 (회원가입 시 필수)</label>
          <input type="text" id="nickname" placeholder="사용할 닉네임 입력" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="handleSignUp()" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg text-sm hover:bg-gray-200 transition">회원가입</button>
        <button type="button" onclick="handleSignIn()" class="flex-1 bg-indigo-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-indigo-700 transition">로그인</button>
      </div>
      <p id="auth-msg" class="text-xs text-center text-red-500 min-h-[16px]"></p>
    </section>

    <!-- 2. 동적 카테고리 탭 -->
    <section id="category-tabs-container" class="flex gap-2 overflow-x-auto pb-2 border-b no-scrollbar">
    </section>

    <!-- 3. 게시글 작성 폼 -->
    <section id="write-section" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border space-y-4 hidden">
      <h2 class="text-sm sm:text-md font-bold text-gray-800 flex items-center gap-2">
        ✏️ 새 글 작성하기
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">카테고리</label>
          <select id="post-category" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
          <input type="text" id="post-title" placeholder="제목을 입력하세요" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">내용 (유튜브 주소를 남기시면 영상 플레이어가 자동 생성됩니다)</label>
        <textarea id="post-content" rows="3" placeholder="내용을 입력하세요..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <!-- 다중 파일 첨부 -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">
          📎 파일 첨부 (사진 자동 용량 축소, 음악, 동영상, PDF 등 다중 선택 가능)
        </label>
        <input type="file" id="post-files" multiple accept="image/*, audio/*, video/*, application/pdf, .zip, .docx, .xlsx, .pptx, .hwp, .hwpx" class="w-full text-xs sm:text-sm text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
      </div>

      <div class="flex justify-end">
        <button type="button" onclick="createPost()" id="submit-btn" class="w-full sm:w-auto bg-indigo-600 text-white font-semibold px-6 py-2 rounded-lg text-sm hover:bg-indigo-700 transition">
          게시하기
        </button>
      </div>
    </section>

    <!-- 4. 검색 기능 및 자동완성 -->
    <section class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border space-y-2 relative">
      <div class="grid grid-cols-2 sm:flex gap-2">
        <select id="search-category" class="w-full sm:w-auto px-3 py-2 border rounded-lg text-xs sm:text-sm bg-white font-medium">
        </select>

        <select id="search-type" onchange="toggleSearchInput()" class="w-full sm:w-auto px-3 py-2 border rounded-lg text-xs sm:text-sm bg-white font-medium">
          <option value="all">제목 + 내용</option>
          <option value="title">제목</option>
          <option value="content">내용</option>
          <option value="date">날짜 (달력)</option>
        </select>
      </div>

      <div class="relative flex-1">
        <input type="text" id="search-keyword" placeholder="검색어를 입력하세요" class="w-full px-3 py-2 border rounded-lg text-xs sm:text-sm" oninput="handleKeywordInput()" onfocus="handleKeywordInput()" onkeypress="if(event.key === 'Enter') executeSearch()">
        <div id="search-autocomplete-box" class="absolute left-0 right-0 top-full mt-1 bg-white border rounded-xl shadow-lg z-50 hidden max-h-48 overflow-y-auto"></div>
      </div>

      <input type="date" id="search-date" class="hidden w-full px-3 py-2 border rounded-lg text-xs sm:text-sm" onkeypress="if(event.key === 'Enter') executeSearch()">
      
      <div class="flex gap-1.5 sm:gap-2">
        <button type="button" onclick="executeSearch()" class="flex-1 sm:flex-none bg-gray-700 text-white font-semibold px-4 py-2 rounded-lg text-xs sm:text-sm hover:bg-gray-800 transition">검색</button>
        <button type="button" onclick="executeRandomSearch()" class="flex-1 sm:flex-none bg-amber-600 text-white font-semibold px-4 py-2 rounded-lg text-xs sm:text-sm hover:bg-amber-700 transition">🔀 랜덤</button>
        <button type="button" onclick="resetSearch()" class="flex-1 sm:flex-none bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-lg text-xs sm:text-sm hover:bg-gray-300 transition">초기화</button>
      </div>
    </section>

    <!-- 5. 게시글 목록 출력 -->
    <section id="posts-container" class="space-y-4">
      <div class="text-center py-12 text-gray-400">게시글을 불러오는 중...</div>
    </section>

  </main>

  <footer class="w-full bg-white border-t mt-8 sm:mt-12 py-6 text-center text-xs text-gray-400">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <p id="footer-copy">© 커뮤니티</p>
      <a href="https://github.com/gitko11111/kim#readme" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-semibold text-gray-500 hover:text-indigo-600 underline transition">
        ⚙️ 관리자 가이드 (GitHub README)
      </a>
    </div>
  </footer>

  <script>
    const SITE_CONFIGS = {
      oliver: {
        siteId: 'oliver',
        title: "📚 독서회 커뮤니티",
        categories: [
          { id: 'notice', label: '📢 공지사항' },
          { id: 'book_review', label: '📖 책 감상/토론' },
          { id: 'korean_lit', label: '🇰🇷 한국 문학' },
          { id: 'free', label: '💬 자유 게시판' }
        ]
      },
      withkeke: {
        siteId: 'withkeke',
        title: "🐶 케케와 함께",
        categories: [
          { id: 'travel', label: '✈️ 여행' },
          { id: 'daily', label: '☕ 일상' },
          { id: 'food', label: '🍽️ 맛집' }
        ]
      },
      language: {
        siteId: 'language',
        title: "🌐 New Language Study",
        categories: [
          { id: 'korean', label: '🇰🇷 한국어' },
          { id: 'chinese1', label: '🇨🇳 중국어 1' },
          { id: 'chinese2', label: '🇨🇳 중국어 2' },
          { id: 'english1', label: '🇺🇸 영어 1' },
          { id: 'english2', label: '🇺🇸 영어 2' },
          { id: 'japanese', label: '🇯🇵 일본어 1' },
          { id: 'japanese2', label: '🇯🇵 일본어 2' },
          { id: 'spanish', label: '🇪🇸 스페인어' }
        ]
      }
    };

    // 💡 기본값을 'withkeke'로 설정하여 케케 게시판이 기본으로 뜨게 수정
    let CURRENT_SITE_KEY = 'withkeke';
    const host = window.location.hostname.toLowerCase();

    if (host.indexOf('oliver') !== -1 || host.indexOf('book') !== -1) {
      CURRENT_SITE_KEY = 'oliver';
    } else if (host.indexOf('language') !== -1) {
      CURRENT_SITE_KEY = 'language';
    } else {
      CURRENT_SITE_KEY = 'withkeke';
    }

    const currentSiteConfig = SITE_CONFIGS[CURRENT_SITE_KEY];

    let rawUrl = "https://rxuodtvhhqfcyuypygba.supabase.co";
    let rawKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dW9kdHZoaHFmY3l1eXB5Z2JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Mjk3NjcsImV4cCI6MjEwNzEwNTc2N30.OmY435tnNVJtPlhjA2ilJKF-snA85Rm34_SUwgE0AoU";

    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(rawUrl, rawKey);
    } catch(e) {
      console.error("Supabase 생성 에러:", e);
    }

    let currentCategory = 'all';
    let currentUser = null;
    let userDisplayName = '';
    
    let currentSearchCategory = 'all';
    let currentSearchType = 'all';
    let currentSearchKeyword = '';
    let currentSearchDate = '';

    let allSearchKeywordsHistory = []; 
    const loadedPostsMap = {};

    window.addEventListener('DOMContentLoaded', async () => {
      initSiteUI();
      try {
        await checkAuth();
      } catch (e) {}
      await loadPostsForAutocomplete();
      loadPosts();
      
      document.addEventListener('click', (e) => {
        const box = document.getElementById('search-autocomplete-box');
        const input = document.getElementById('search-keyword');
        if (box && input && !box.contains(e.target) && e.target !== input) {
          box.classList.add('hidden');
        }
      });
    });

    function initSiteUI() {
      document.getElementById('site-page-title').innerText = currentSiteConfig.title;
      document.getElementById('site-header-title').innerHTML = currentSiteConfig.title;
      document.getElementById('footer-copy').innerText = `© ${currentSiteConfig.title}`;

      const tabsContainer = document.getElementById('category-tabs-container');
      let tabsHtml = `<button type="button" onclick="setCategory('all')" id="tab-all" class="cat-tab px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold bg-indigo-600 text-white shadow-sm shrink-0">전체</button>`;
      
      currentSiteConfig.categories.forEach(cat => {
        tabsHtml += `<button type="button" onclick="setCategory('${cat.id}')" id="tab-${cat.id}" class="cat-tab px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border shrink-0">${cat.label}</button>`;
      });
      tabsContainer.innerHTML = tabsHtml;

      const postCatSelect = document.getElementById('post-category');
      let postCatHtml = '';
      currentSiteConfig.categories.forEach(cat => {
        postCatHtml += `<option value="${cat.id}">${cat.label}</option>`;
      });
      postCatSelect.innerHTML = postCatHtml;

      const searchCatSelect = document.getElementById('search-category');
      let searchCatHtml = `<option value="all">전체 카테고리</option>`;
      currentSiteConfig.categories.forEach(cat => {
        searchCatHtml += `<option value="${cat.id}">${cat.label}</option>`;
      });
      searchCatSelect.innerHTML = searchCatHtml;
    }

    async function checkAuth() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.auth.getUser();
        currentUser = data?.user || null;
        if (currentUser) {
          userDisplayName = currentUser.user_metadata?.nickname || currentUser.email.split('@')[0];
        }
      } catch (err) {
        currentUser = null;
        userDisplayName = '';
      }

      const authStatusEl = document.getElementById('auth-status');
      const authSectionEl = document.getElementById('auth-section');
      const writeSectionEl = document.getElementById('write-section');

      if (currentUser) {
        authStatusEl.innerHTML = `
          <span class="text-xs text-gray-600 font-medium">👤 ${escapeHtml(userDisplayName)} 님</span>
          <button type="button" onclick="handleSignOut()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2.5 py-1 rounded-lg transition">로그아웃</button>
        `;
        authSectionEl.classList.add('hidden');
        writeSectionEl.classList.remove('hidden');
      } else {
        authStatusEl.innerHTML = `
          <button type="button" onclick="toggleAuthForm()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">로그인 / 회원가입</button>
        `;
        writeSectionEl.classList.add('hidden');
      }
    }

    function toggleAuthForm() {
      document.getElementById('auth-section').classList.toggle('hidden');
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value.trim();
      const msgEl = document.getElementById('auth-msg');

      if(!email || !password || !nickname) {
        msgEl.innerText = "이메일, 비밀번호, 닉네임을 모두 입력해주세요.";
        return;
      }

      msgEl.innerText = "회원가입 처리 중...";
      const { error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { nickname: nickname } }
      });

      if (error) {
        msgEl.innerText = "회원가입 실패: " + error.message;
      } else {
        msgEl.innerText = "가입 완료! 로그인되었습니다.";
        await checkAuth();
        loadPosts();
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('auth-msg');

      if(!email || !password) {
        msgEl.innerText = "이메일과 비밀번호를 입력해주세요.";
        return;
      }

      msgEl.innerText = "로그인 중...";
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msgEl.innerText = "로그인 실패: " + error.message;
      } else {
        msgEl.innerText = "";
        await checkAuth();
        loadPosts();
      }
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      await checkAuth();
      loadPosts();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.className = "cat-tab px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border shrink-0";
      });
      const activeBtn = document.getElementById(`tab-${cat}`);
      if(activeBtn) {
        activeBtn.className = "cat-tab px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold bg-indigo-600 text-white shadow-sm shrink-0";
      }

      document.getElementById('search-category').value = cat;
      currentSearchCategory = cat;

      loadPosts();
    }

    function toggleSearchInput() {
      const type = document.getElementById('search-type').value;
      const keywordInput = document.getElementById('search-keyword');
      const dateInput = document.getElementById('search-date');
      const autocompleteBox = document.getElementById('search-autocomplete-box');

      if (type === 'date') {
        keywordInput.classList.add('hidden');
        dateInput.classList.remove('hidden');
        if(autocompleteBox) autocompleteBox.classList.add('hidden');
      } else {
        keywordInput.classList.remove('hidden');
        dateInput.classList.add('hidden');
      }
    }

    async function loadPostsForAutocomplete() {
      try {
        const { data: posts } = await supabaseClient.from('posts').select('title');
        if (!posts) return;

        const stopWords = new Set([
          'sh', 'shu', 'ch', 'th', 'ph', 'wh', 'uh', 'ah', 'oh', 'the', 'and', 'for', 'with', 'this', 'that'
        ]);

        const wordCounts = {};

        posts.forEach(p => {
          if (!p.title) return;
          const rawWords = p.title.split(/\s+/);

          rawWords.forEach(w => {
            let cleanW = w.trim();
            const lowerW = cleanW.toLowerCase();

            if (!cleanW || stopWords.has(lowerW)) return;

            if (/[가-힣]/.test(cleanW)) {
              cleanW = cleanW.replace(/(에서는|에서|으로|까지|부터|에게|한테|은|는|이|가|의|에|을|를|과|와|도|만|로)$/g, '');
            }

            if (cleanW.length >= 2 || /\d+\.\d+/.test(cleanW)) {
              wordCounts[cleanW] = (wordCounts[cleanW] || 0) + 1;
            }
          });
        });

        const localHistory = JSON.parse(localStorage.getItem('my_search_history') || '[]');
        localHistory.forEach(kw => {
          if (kw) wordCounts[kw] = (wordCounts[kw] || 0) + 5;
        });

        allSearchKeywordsHistory = Object.keys(wordCounts)
          .sort((a, b) => wordCounts[b] - wordCounts[a]);

      } catch (e) {
        console.error("자동완성 로드 에러:", e);
      }
    }

    function handleKeywordInput() {
      const inputVal = document.getElementById('search-keyword').value.trim().toLowerCase();
      const box = document.getElementById('search-autocomplete-box');
      if (!box) return;

      const filtered = allSearchKeywordsHistory.filter(kw => kw.toLowerCase().includes(inputVal));

      if (filtered.length === 0) {
        box.classList.add('hidden');
        return;
      }

      let html = '';
      filtered.slice(0, 8).forEach(kw => {
        html += `<div onclick="selectKeyword('${escapeHtml(kw)}')" class="px-4 py-2.5 text-xs text-gray-700 hover:bg-indigo-50 cursor-pointer border-b last:border-b-0 flex items-center justify-between">
          <span>🔍 ${escapeHtml(kw)}</span>
          <span class="text-[10px] text-indigo-500 font-semibold">추천 검색어</span>
        </div>`;
      });

      box.innerHTML = html;
      box.classList.remove('hidden');
    }

    function selectKeyword(kw) {
      document.getElementById('search-keyword').value = kw;
      document.getElementById('search-autocomplete-box').classList.add('hidden');
      executeSearch();
    }

    function executeSearch() {
      currentSearchCategory = document.getElementById('search-category').value;
      currentSearchType = document.getElementById('search-type').value;

      if (currentSearchType === 'date') {
        currentSearchDate = document.getElementById('search-date').value;
        currentSearchKeyword = '';
      } else {
        currentSearchKeyword = document.getElementById('search-keyword').value.trim();
        currentSearchDate = '';

        if (currentSearchKeyword && currentSearchKeyword.length >= 2) {
          let localHistory = JSON.parse(localStorage.getItem('my_search_history') || '[]');
          if (!localHistory.includes(currentSearchKeyword)) {
            localHistory.unshift(currentSearchKeyword);
            if (localHistory.length > 20) localHistory.pop();
            localStorage.setItem('my_search_history', JSON.stringify(localHistory));
          }
        }
      }

      const box = document.getElementById('search-autocomplete-box');
      if (box) box.classList.add('hidden');

      currentCategory = currentSearchCategory;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.className = "cat-tab px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold bg-white text-gray-600 hover:bg-gray-50 border shrink-0";
      });
      const activeBtn = document.getElementById(`tab-${currentCategory}`);
      if(activeBtn) {
        activeBtn.className = "cat-tab px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold bg-indigo-600 text-white shadow-sm shrink-0";
      }

      loadPostsForAutocomplete();
      loadPosts();
    }

    async function executeRandomSearch() {
      const container = document.getElementById('posts-container');
      if (!container) return;
      container.innerHTML = `<div class="text-center py-12 text-gray-400">🎲 숨겨진 게시글을 뽑는 중...</div>`;

      try {
        let query = supabaseClient
          .from('posts')
          .select('*')
          .order('search_count', { ascending: true })
          .order('created_at', { ascending: false })
          .limit(50);

        if (currentCategory !== 'all') {
          query = query.eq('category', currentCategory);
        }

        const { data: posts, error } = await query;

        if (error) {

    function getYouTubeEmbedsHtml(content) {
      if (!content) return '';
      const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
      const videoIds = new Set();
      let match;
      while ((match = ytRegex.exec(content)) !== null) {
        videoIds.add(match[1]);
      }

      if (videoIds.size === 0) return '';

      let html = '<div class="space-y-3 pt-2">';
      videoIds.forEach(id => {
        html += `
          <div class="space-y-1">
            <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-sm border bg-black">
              <iframe 
                class="absolute top-0 left-0 w-full h-full"
                src="https://www.youtube.com/embed/${id}" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
              </iframe>
            </div>
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    function parseAttachments(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'object') return [raw];
      if (typeof raw === 'string') {
        const trimmed = raw.trim();
        if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
          try {
            const parsed = JSON.parse(trimmed);
            return Array.isArray(parsed) ? parsed : [parsed];
          } catch(e) {
            return [{ name: '첨부파일', url: trimmed, type: 'image/jpeg' }];
          }
        } else if (trimmed) {
          return [{ name: '첨부파일', url: trimmed, type: 'image/jpeg' }];
        }
      }
      return [];
    }

    async function compressImage(file) {
      return new Promise((resolve) => {
        if (!file.type.startsWith('image/') || file.type.includes('svg') || file.size <= 500 * 1024) {
          resolve(file);
          return;
        }

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1200;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (!blob) {
                resolve(file);
                return;
              }
              const compressedFile = new File([blob], file.name, {
                type: 'image/jpeg',
                lastModified: Date.now()
              });
              resolve(compressedFile);
            }, 'image/jpeg', 0.80);
          };
          img.onerror = () => resolve(file);
        };
        reader.onerror = () => resolve(file);
      });
    }

    async function uploadFilesToStorage(files, bucketName = 'files', prefix = 'file') {
      const attachments = [];

      for (let i = 0; i < files.length; i++) {
        let file = files[i];

        if (file.type.startsWith('image/')) {
          file = await compressImage(file);
        }

        const fileExt = file.name.split('.').pop();
        const fileName = `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2,7)}.${fileExt}`;

        const { error: uploadError } = await supabaseClient.storage.from(bucketName).upload(fileName, file);
        if (uploadError) {
          throw new Error(`'${file.name}' 업로드 실패: ` + uploadError.message);
        }

        const { data: publicUrlData } = supabaseClient.storage.from(bucketName).getPublicUrl(fileName);
        attachments.push({
          name: file.name,
          url: publicUrlData.publicUrl,
          type: file.type
        });
      }

      return attachments;
    }

      submitBtn.disabled = true;
      submitBtn.innerText = "업로드 중...";

      const files = Array.from(fileInput.files);

      try {
        let attachments = [];
        if (files.length > 0) {

        }

        const { error: dbError } = await supabaseClient

        submitBtn.disabled = false;
        submitBtn.innerText = "게시하기";
      }
    }

                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2">
                      <input type="file" id="comment-files-${post.id}" multiple accept="image/*, audio/*, video/*, application/pdf" class="text-xs text-gray-500 flex-1">
                      <button type="button" onclick="addComment(${post.id})" id="comment-submit-btn-${post.id}" class="bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-lg hover:bg-indigo-700 transition">댓글 등록</button>
                    </div>
                  </div>
                ` : `
                  <p class="text-xs text-gray-400 text-center py-2 bg-gray-50 rounded-lg">댓글을 작성하려면 로그인이 필요합니다.</p>
                `}
              </div>
            </article>
          `;
        });

        const postsHtmlArray = await Promise.all(postHtmlPromises);
        container.innerHTML = postsHtmlArray.join('');
      } catch (err) {
        container.innerHTML = `<div class="bg-white p-8 rounded-2xl border text-center text-red-500">⚠️ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function addComment(postId) {
      if (!currentUser) {
        alert("로그인이 필요합니다.");
        return;
      }

      const inputEl = document.getElementById(`comment-input-${postId}`);
      const fileInput = document.getElementById(`comment-files-${postId}`);
      const submitBtn = document.getElementById(`comment-submit-btn-${postId}`);
      const content = inputEl ? inputEl.value.trim() : '';
      const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];

      if (!content && files.length === 0) {
        alert("댓글 내용이나 첨부파일 중 하나는 입력해주세요.");
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "등록 중...";
      }

      try {
        let attachments = [];
        if (files.length > 0) {
          attachments = await uploadFilesToStorage(files, 'files', 'comment');
        }

        const authorName = userDisplayName || currentUser.email.split('@')[0];
        const imageUrlValue = attachments.length > 0 ? JSON.stringify(attachments) : null;

        const payload = { post_id: postId, user_email: authorName, content: content };
        if (imageUrlValue) payload.image_url = imageUrlValue;

        const { data, error } = await supabaseClient.from('comments').insert([payload]).select();

        if (error) {
          alert("댓글 작성 실패: " + error.message);
        } else {
          if (inputEl) inputEl.value = '';
          if (fileInput) fileInput.value = '';
          loadPosts();
        }
      } catch (e) {
        alert("댓글 등록 중 오류 발생: " + e.message);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = "댓글 등록";
        }
      }
    }

    async function deletePost(postId) {
      if (!currentUser || !confirm("정말로 이 게시글을 삭제하시겠습니까?")) return;

      try {
        const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
        if (error) alert("삭제 실패: " + error.message);
        else {
          loadPostsForAutocomplete();
          loadPosts();
        }
      } catch (err) {
        alert("삭제 중 오류 발생");
      }
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function openEditForm(postId) {
      const post = loadedPostsMap[postId];
      if (!post) return;

      const viewEl = document.getElementById(`post-view-${postId}`);
      if (!viewEl) return;

      let catOptionsHtml = '';
      currentSiteConfig.categories.forEach(cat => {
        const selected = (cat.id === post.category) ? 'selected' : '';
        catOptionsHtml += `<option value="${cat.id}" ${selected}>${cat.label}</option>`;
      });

      viewEl.innerHTML = `
        <div class="bg-indigo-50/70 p-4 rounded-xl border border-indigo-200 space-y-3">
          <h4 class="text-sm font-bold text-indigo-700 flex items-center gap-1">✏️ 게시글 수정</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">카테고리</label>
              <select id="edit-category-${postId}" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${catOptionsHtml}
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
              <input type="text" id="edit-title-${postId}" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">내용</label>
            <textarea id="edit-content-${postId}" rows="4" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">추가 파일 첨부</label>
            <input type="file" id="edit-files-${postId}" multiple accept="image/*, audio/*, video/*, application/pdf" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-100 file:text-indigo-700">
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="cancelEdit()" class="bg-gray-200 text-gray-700 font-semibold px-4 py-1.5 rounded-lg text-xs hover:bg-gray-300 transition">취소</button>
            <button type="button" onclick="updatePost(${postId})" id="edit-submit-btn-${postId}" class="bg-indigo-600 text-white font-semibold px-4 py-1.5 rounded-lg text-xs hover:bg-indigo-700 transition">저장</button>
          </div>
        </div>
      `;

      document.getElementById(`edit-title-${postId}`).value = post.title || '';
      document.getElementById(`edit-content-${postId}`).value = post.content || '';
    }

    function cancelEdit() {
      loadPosts(); 
    }

    async function updatePost(postId) {
      const post = loadedPostsMap[postId];
      const category = document.getElementById(`edit-category-${postId}`).value;
      const title = document.getElementById(`edit-title-${postId}`).value.trim();
      const content = document.getElementById(`edit-content-${postId}`).value.trim();
      const fileInput = document.getElementById(`edit-files-${postId}`);
      const submitBtn = document.getElementById(`edit-submit-btn-${postId}`);

      if (!title || !content) {
        alert("제목과 내용을 모두 입력해주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "저장 중...";

      try {
        let existingAttachments = parseAttachments(post.image_url);
        const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];

        if (files.length > 0) {
          const newAttachments = await uploadFilesToStorage(files, 'files', 'post');
          existingAttachments = [...existingAttachments, ...newAttachments];
        }

        const imageUrlValue = existingAttachments.length > 0 ? JSON.stringify(existingAttachments) : null;

        const { error } = await supabaseClient
          .from('posts')
          .update({ category: category, title: title, content: content, image_url: imageUrlValue })
          .eq('id', postId);

        if (error) {
          alert("수정 실패: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "저장";
        } else {
          alert("성공적으로 수정되었습니다!");
          loadPostsForAutocomplete();
          loadPosts(); 
        }
      } catch (e) {
        alert("수정 중 오류 발생: " + e.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "저장";
      }
    }
  </script>
</body>
</html>
